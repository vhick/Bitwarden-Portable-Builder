name: Build Bitwarden Portable ZIP (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bitwarden Desktop official stable version (for example 2026.10.0)'
        type: string
        required: true
        default: '2026.10.0'
      expected_sha256:
        description: 'Optional official SHA-256; required only if GitHub omits asset digest for a newer release'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bitwarden-portable-manual-build
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout builder files only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon converter library
        shell: pwsh
        run: python -m pip install Pillow==11.3.0
      - name: Run offline safety tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download, checksum-verify and stage official Bitwarden portable EXE
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BITWARDEN_VERSION: ${{ inputs.version }}
          OFFICIAL_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          python builder/build_portable.py --version "$env:BITWARDEN_VERSION" --sha256 "$env:OFFICIAL_SHA256" --stage stage/BitwardenPortable --cache cache
          if ($LASTEXITCODE -ne 0) { throw 'Bitwarden official download or validation failed' }
      - name: Compile portable launcher using the official Bitwarden icon
        shell: pwsh
        run: |
          & ./builder/compile_launcher.ps1 -StageDir 'stage/BitwardenPortable'
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
      - name: Verify ZIP structure and reject any vault data
        shell: pwsh
        env:
          BITWARDEN_VERSION: ${{ inputs.version }}
        run: |
          python builder/verify_zip.py --stage stage/BitwardenPortable --zip "artifacts/Bitwarden-v$env:BITWARDEN_VERSION-TruePortable.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }
      - name: Publish downloadable portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitwarden-Portable-${{ inputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
